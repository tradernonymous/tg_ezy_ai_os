<!DOCTYPE html>
<html lang="en" data-build="aios-r2">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — EzyViral OS</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/img/EzyViralAi-mark-color.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05030f; --bg-2: #0a0620; --surface: rgba(16,12,38,.72);
    --surface-2: rgba(26,20,58,.72); --border: rgba(139,92,246,.22); --border-strong: rgba(168,85,247,.45);
    --text: #f6f4ff; --text-2: #c6c0e8; --text-3: #a09ac8;
    --purple: #8b5cf6; --violet: #a855f7; --cyan: #22d3ee; --fuchsia: #e879f9; --pink: #f472b6;
    --green: #0BD97E; --gold: #F4C63D; --danger: #f27e7e;
    --r-lg: 22px; --r: 12px;
    --tr-smooth: 320ms cubic-bezier(.22,1,.36,1);
    --font-d: 'Space Grotesk', 'Inter', system-ui, sans-serif;
    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-synthesis: none;
  }
  * { box-sizing: border-box; margin: 0; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  html, body { background: var(--bg); color: var(--text); font-family: var(--font); }
  h1,h2,h3 { font-family: var(--font-d); }
  a { color: var(--cyan); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- landing-matched background layers ---------- */
  #starfield, #nebula { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  #orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: .5; will-change: transform; }
  .orb.o1 { width: 54vmax; height: 54vmax; background: var(--purple); top: -22vmax; left: -14vmax; animation: orbA 26s ease-in-out infinite alternate; }
  .orb.o2 { width: 46vmax; height: 46vmax; background: var(--cyan); bottom: -20vmax; right: -16vmax; animation: orbB 34s ease-in-out infinite alternate-reverse; }
  .orb.o3 { width: 40vmax; height: 40vmax; background: var(--fuchsia); top: 30%; left: 55%; opacity: .32; animation: orbC 30s ease-in-out infinite alternate; }
  @keyframes orbA { to { transform: translate(8vmax, 6vmax) scale(1.2); } }
  @keyframes orbB { to { transform: translate(-9vmax, -7vmax) scale(1.25); } }
  @keyframes orbC { to { transform: translate(-6vmax, 8vmax) scale(1.15); } }
  #grid { position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: radial-gradient(rgba(139,92,246,.22) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
    mask-image: radial-gradient(ellipse 90% 60% at 50% 0%, #000 30%, transparent 78%);
  }

  body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

  /* ---------- sticky header with Home button ---------- */
  header { position: sticky; top: 0; z-index: 80; background: rgba(5,3,15,.55);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border);
    transition: var(--tr-smooth); }
  nav { max-width: 1140px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-d); font-weight: 700; font-size: 17px; }
  .brand img { height: 34px; width: auto; filter: drop-shadow(0 0 16px rgba(11,217,126,.45)) drop-shadow(0 4px 18px rgba(139,92,246,.4)); }
  .brand .name b { background: linear-gradient(90deg, var(--green), var(--cyan), var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; position: relative; overflow: hidden;
    height: 46px; padding: 0 22px; border-radius: 999px; font-size: 14px; font-weight: 650; cursor: pointer; font-family: var(--font);
    border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text);
    transition: transform 160ms ease, border-color 200ms ease, box-shadow 200ms ease, background 200ms ease; }
  .btn:hover { border-color: var(--cyan); box-shadow: 0 0 22px rgba(34,211,238,.28); text-decoration: none; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: linear-gradient(100deg, var(--purple), var(--violet) 55%, var(--fuchsia)); color: #fff;
    border-color: rgba(255,255,255,.18); box-shadow: 0 8px 30px rgba(139,92,246,.45), inset 0 1px 0 rgba(255,255,255,.25);
    animation: ctaGlow 3.4s ease-in-out infinite; }
  @keyframes ctaGlow { 0%,100% { box-shadow: 0 8px 30px rgba(139,92,246,.45), inset 0 1px 0 rgba(255,255,255,.25); }
    50% { box-shadow: 0 8px 46px rgba(168,85,247,.8), 0 0 34px rgba(34,211,238,.45), inset 0 1px 0 rgba(255,255,255,.3); } }
  .btn.primary::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34%; left: -40%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.45), transparent); transform: skewX(-18deg); animation: sheen 5.2s ease-in-out infinite; }
  @keyframes sheen { 0%, 70% { left: -40%; } 100% { left: 135%; } }
  .btn:disabled { opacity: .55; cursor: not-allowed; animation: none; }

  /* ---------- card ---------- */
  main { flex: 1; display: grid; place-items: center; padding: 44px 16px 64px; position: relative; z-index: 1; }
  .card { width: 100%; max-width: 430px; background: var(--surface); border: 1px solid var(--border-strong);
    border-radius: var(--r-lg); padding: 30px 28px 26px; position: relative; z-index: 1;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 24px 70px rgba(0,0,0,.5), 0 0 60px rgba(139,92,246,.14), inset 0 1px 0 rgba(255,255,255,.06);
    animation: rise 420ms cubic-bezier(.22,1,.36,1);
    background-image: radial-gradient(circle at 88% -8%, rgba(232,121,249,.16), transparent 42%), radial-gradient(circle at 6% 112%, rgba(34,211,238,.12), transparent 42%); }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border); padding: 6px 14px; border-radius: 999px; margin-bottom: 16px; }
  .badge .live { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  h1 { font-size: 26px; font-weight: 700; margin: 2px 0 6px; letter-spacing: -.4px; }
  h1 .grad { background: linear-gradient(100deg, var(--cyan), var(--purple), var(--fuchsia)); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: gradShift 7s linear infinite; }
  @keyframes gradShift { to { background-position: 300% 0; } }
  .lead { font-size: 13.5px; color: var(--text-2); margin-bottom: 22px; line-height: 1.6; }

  .providers { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
  .providers .btn { width: 100%; }
  .divider { display: flex; align-items: center; gap: 12px; color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: .9px; margin: 18px 0; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .mgrid { display: flex; flex-direction: column; gap: 11px; }

  input { width: 100%; height: 46px; border-radius: var(--r); border: 1px solid var(--border-strong); background: rgba(8,5,24,.72);
    color: var(--text); font-size: 14px; font-family: var(--font); padding: 0 14px; outline: none; transition: border-color var(--tr-smooth), box-shadow var(--tr-smooth); }
  input::placeholder { color: var(--text-3); }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(34,211,238,.16), 0 0 20px rgba(34,211,238,.12); }
  .code-row { display: flex; gap: 10px; }
  .code-row input { flex: 1; letter-spacing: 5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
  .code-preview { background: rgba(8,5,24,.72); border: 1px dashed var(--border-strong); border-radius: var(--r);
    padding: 12px 14px; font-size: 24px; font-weight: 800; text-align: center; letter-spacing: 8px; color: var(--green); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .step-hint { font-size: 12px; color: var(--text-3); margin-bottom: 9px; line-height: 1.55; }
  .step-hint b { color: var(--text-2); }
  .provider-hint { font-size: 12px; color: var(--text-3); line-height: 1.65; margin-top: 10px; text-align: center; word-break: break-word; }
  .provider-hint code { color: var(--text-2); background: rgba(255,255,255,.06); padding: 1px 6px; border-radius: 5px; }
  .err { color: var(--danger); font-size: 12px; min-height: 16px; margin: 4px 0 0; display: none; }
  .err.show { display: block; }
  .foot { margin-top: 20px; font-size: 12px; color: var(--text-3); text-align: center; line-height: 1.7; }
  .hidden { display: none !important; }
  .gsi { height: 46px; }
  .gsi > div:not(#gsiDisable) { width: 100%; height: 46px; display: flex; }
  .gsi iframe { border-radius: var(--r) !important; }
  .spinner { width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="starfield"></div>
<div id="grid"></div>
<div id="orbs"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>

<header>
  <nav>
    <div class="brand">
      <img src="/img/EzyViralAi-mark-color.svg" alt="EzyViral OS mark">
      <div class="name"><b>EzyViral</b> OS</div>
    </div>
    <a class="btn" href="/home" aria-label="Back to the landing page">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Home
    </a>
  </nav>
</header>

<main>
  <div class="card">
    <div class="badge"><span class="live"></span><span>Secure sign-in · EzyViral OS</span></div>

    <h1>Welcome back to <span class="grad">your command center</span></h1>
    <p class="lead">Leads, pipeline, AI tools and every channel in one place. Sign in to pick up where you left off.</p>

    <div class="providers" id="providers"></div>

    <div class="divider">or magic key</div>

    <div id="magicPanel">
      <form id="magicForm" class="mgrid">
        <input type="email" id="magicEmail" placeholder="you@email.com" autocomplete="email" required>
        <div class="err" id="magicErr"></div>
        <button class="btn primary" id="magicBtn" type="submit">Email me a code</button>
      </form>
      <form id="verifyForm" class="hidden" style="margin-top:12px;">
        <div id="codePreview" class="code-preview hidden"></div>
        <div class="step-hint" id="verifyHint">Enter the 6-digit code.</div>
        <div class="code-row">
          <input id="magicCode" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="one-time-code">
          <button class="btn primary" id="verifyBtn" type="submit" style="width:88px;padding:0;">Go</button>
        </div>
        <div class="err" id="verifyErr"></div>
      </form>
    </div>

    <p class="foot">Protected end-to-end · sessions last 7 days<br>
      <a href="/home">← Back to the landing page</a></p>
  </div>
</main>

<script>
let cfg = null;
const isDevPreview = () => !!cfg?.magicDevPreview;

async function boot() {
  try {
    const r = await fetch('/api/auth/config');
    cfg = await r.json();
  } catch (e) { cfg = { providers: [], googleClientId: '', telegramBot: '', magicDevPreview: false }; }
  renderProviders();
  const g = document.getElementById('magicEmail');
  if (isDevPreview()) g.autocomplete = 'username'; // dev preview: any email works
}

function providerBtn(emoji, label, onClick) {
  const b = document.createElement('button');
  b.className = 'btn';
  b.type = 'button';
  b.innerHTML = `<span style="font-size:16px;">${emoji}</span> ${label}`;
  b.addEventListener('click', onClick);
  document.getElementById('providers').appendChild(b);
}

function showHint(containerId, html) {
  const host = document.getElementById(containerId);
  if (!host) return null;
  const h = document.createElement('div');
  h.className = 'provider-hint';
  h.innerHTML = html;
  host.appendChild(h);
  return h;
}

function renderProviders() {
  const host = document.getElementById('providers');
  host.innerHTML = '';
  if (cfg.googleClientId) {
    host.innerHTML += `<div class="gsi" id="gsiWrap"></div>`;
    loadGSI();
  }
  if (cfg.telegramBot) {
    const wrap = document.createElement('div');
    wrap.id = 'tgWrap';
    wrap.style.cssText = 'display:flex;justify-content:center;';
    host.insertBefore(wrap, host.firstChild);
    loadTelegramWidget();
    providerBtn('✈️', 'Continue with Telegram', () => alert('Telegram widget failed to load — add your domain in @BotFather (Bot Settings → Domain) and reload.'));
    setTimeout(() => {
      const w = document.getElementById('tgWrap');
      if (!w || w.querySelector('iframe')) return;
      showHint('tgWrap', 'Telegram widget didn&#39;t render. In <b>@BotFather</b>: Bot Settings → Domain, add <code>tg-ezy-ai-os-young-blossom-4821.fly.dev</code> and <code>localhost</code>, then reload.');
    }, 4000);
  }
  if (cfg.googleClientId === '' && cfg.telegramBot === '') {
    host.innerHTML = `<p style="font-size:12px;color:var(--text-3);line-height:1.6;">Sign-in providers are being connected — for now, use the <b>Magic Key</b> below${isDevPreview() ? ' (shows your code instantly)' : ''}.</p>`;
  }
}

function post(path, body) {
  return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
}
function afterLogin(d) {
  if (d && d.ok) { location.href = '/dashboard'; return; }
  showErr('googleErr' in d ? 'googleErr' : 'loginErr');
}
function showErr(id) {
  const el = document.getElementById('magicErr');
  if (el) { el.textContent = 'Sign-in failed. Please try again.'; el.classList.add('show'); }
}

function onGoogleCredential(credential) {
  showBusy(true);
  post('/api/auth/google', { credential }).then(d => {
    showBusy(false);
    if (d && d.ok) location.href = '/dashboard';
    else { const el = document.getElementById('magicErr'); el.textContent = d?.error || 'Google sign-in failed'; el.classList.add('show'); }
  }).catch(() => { showBusy(false); });
}

function showBusy(on) {
  const btn = document.getElementById('magicBtn');
  if (btn && !btn.disabled) { btn.disabled = on; if (on) btn.innerHTML = '<span class="spinner"></span>'; }
}

function loadGSI() {
  const s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true;
  s.onload = () => {
    try {
      globalThis.google?.accounts?.id.initialize({
        client_id: cfg.googleClientId,
        callback: (resp) => onGoogleCredential(resp.credential),
      });
      globalThis.google?.accounts?.id.renderButton(document.getElementById('gsiWrap'), { theme: 'filled_black', size: 'large', width: 372, shape: 'pill' });
    } catch (e) { /* fall through to magic */ }
  s.onerror = () => showHint('gsiWrap', 'Google sign-in failed to load. Add <code>https://tg-ezy-ai-os-young-blossom-4821.fly.dev</code> to <b>Authorized JavaScript origins</b> in Google Cloud Console (APIs & Services → Credentials), save, wait ~2 min, reload.');
};
  document.head.appendChild(s);
}

function loadTelegramWidget() {
  const s = document.createElement('script');
  s.src = 'https://telegram.org/js/telegram-widget.js?22';
  s.setAttribute('data-telegram-login', cfg.telegramBot);
  s.setAttribute('data-size', 'large');
  s.setAttribute('data-radius', '12');
  s.setAttribute('data-request-access', 'write');
  s.setAttribute('data-onauth', 'onTelegramAuth(user)');
  document.getElementById('tgWrap').appendChild(s);
}
function onTelegramAuth(user) {
  post('/api/auth/telegram', { data: user }).then(d => {
    if (d && d.ok) location.href = '/dashboard';
    else { const el = document.getElementById('magicErr'); el.textContent = d?.error || 'Telegram sign-in failed'; el.classList.add('show'); }
  });
}

// Magic Key flow
document.getElementById('magicForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const emailInput = document.getElementById('magicEmail');
  const email = emailInput.value.trim().toLowerCase();
  const errEl = document.getElementById('magicErr');
  errEl.classList.remove('show');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { errEl.textContent = 'Enter a valid email address.'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('magicBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const d = await post('/api/auth/magic/request', { email });
  btn.disabled = false; btn.innerHTML = 'Email me a code';
  if (!d || !d.ok) {
    errEl.textContent = d?.error || 'Could not send code.'; errEl.classList.add('show'); return;
  }
  document.getElementById('magicForm').classList.add('hidden');
  document.getElementById('verifyForm').classList.remove('hidden');
  if (d.delivered === 'preview' && d.code) {
    document.getElementById('codePreview').classList.remove('hidden');
    document.getElementById('codePreview').textContent = d.code;
    document.getElementById('verifyHint').innerHTML = 'Dev preview: your one-time code is shown above. Type it below to continue.';
  } else if (d.delivered === 'email') {
    document.getElementById('verifyHint').textContent = `A 6-digit code is on its way to ${email}. Check your inbox (and spam folder), then enter it below.`;
  } else {
    document.getElementById('verifyHint').textContent = `Email delivery is not configured yet — set EMAIL_API_KEY and EMAIL_FROM so codes are emailed. Your code: check the server logs.`;
  }
  document.getElementById('magicCode').focus();
});

document.getElementById('verifyForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('magicEmail').value.trim().toLowerCase();
  const code = document.getElementById('magicCode').value.trim();
  const errEl = document.getElementById('verifyErr');
  errEl.classList.remove('show');
  if (code.length !== 6) { errEl.textContent = 'Enter the 6-digit code.'; errEl.classList.add('show'); return; }
  const btn = document.getElementById('verifyBtn');
  btn.disabled = true; btn.textContent = '…';
  const d = await post('/api/auth/magic/verify', { email, code });
  btn.disabled = false; btn.textContent = 'Go';
  if (d && d.ok) location.href = '/dashboard';
  else { errEl.textContent = d?.error || 'Invalid or expired code.'; errEl.classList.add('show'); }
});

boot();
</script>
</body>
</html>
