# fly.toml app configuration file generated for tg-ezy-ai-os-young-blossom-4821 on 2026-09-08T11:00:56+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tg-ezy-ai-os-young-blossom-4821'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  INBOX_SIM = 'true'
  PORT = '3000'

[[mounts]]
  source = 'data'
  destination = '/app/db'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
